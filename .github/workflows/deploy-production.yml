name: Deploy Production - Zelify Core

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: [self-hosted, production]
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener variables públicas desde AWS Secrets Manager
        id: fetch-secrets
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "prod/zelify-core" --query "SecretString" --output text)
          
          echo "NEXT_PUBLIC_AUTH_API_URL=$(echo $SECRET_JSON | jq -r .NEXT_PUBLIC_AUTH_API_URL)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_MDC_API_URL=$(echo $SECRET_JSON | jq -r .NEXT_PUBLIC_MDC_API_URL)" >> $GITHUB_ENV

      - name: Construir y empujar imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: zelify-core
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_AUTH_API_URL: ${{ env.NEXT_PUBLIC_AUTH_API_URL }}
          NEXT_PUBLIC_MDC_API_URL: ${{ env.NEXT_PUBLIC_MDC_API_URL }}
        run: |
          echo "Construyendo imagen Docker con variables inyectadas de forma segura..."
          docker build \
            --build-arg NEXT_PUBLIC_AUTH_API_URL="$NEXT_PUBLIC_AUTH_API_URL" \
            --build-arg NEXT_PUBLIC_MDC_API_URL="$NEXT_PUBLIC_MDC_API_URL" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          echo "Empujando tag específico: $IMAGE_TAG"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Etiquetando y empujando tag: latest"
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Cleanup workspace and Docker disk space
        if: always()
        run: |
          echo "Espacio antes de limpiar:"
          df -h / || true
          
          docker system prune -af --volumes
          
          rm -rf node_modules .next .npm dist
          rm -rf "${RUNNER_TEMP:-/tmp}"/npm-cache* 2>/dev/null || true
          
          echo "Espacio después de limpiar:"
          df -h / || true